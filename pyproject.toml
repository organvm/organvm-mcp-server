[build-system]
requires = ["setuptools>=68.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "organvm-mcp-server"
version = "0.1.0"
description = "MCP server exposing ORGANVM system context to any Claude Code session"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "organvm-engine",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
    "pyright>=1.1",
]

[project.scripts]
organvm-mcp = "organvm_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "PTH", "RET", "SIM", "COM", "PL"]
ignore = ["PLR0912", "PLR0913", "PLR0915", "PLC0415", "PLR2004", "PLW0603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
